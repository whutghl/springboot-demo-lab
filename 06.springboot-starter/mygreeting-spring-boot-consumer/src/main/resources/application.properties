# ====================================================================
# 消费方配置文件
# ====================================================================

# 服务器端口（Spring Boot 默认 8080，此处显式声明）
server.port=8080

# ====================================================================
# 自定义 Starter 的配置项
#
# 前缀：mygreeting（与 GreetingProperties 中的 @ConfigurationProperties(prefix) 一致）
#
# 可配置的属性：
#   mygreeting.prefix —— 问候语前缀，默认 "Hello"
#   mygreeting.suffix —— 问候语后缀，默认 "!"
#
# 修改后无需重新编译，重启应用即可生效。
# ====================================================================
mygreeting.prefix=nihao
mygreeting.suffix=!