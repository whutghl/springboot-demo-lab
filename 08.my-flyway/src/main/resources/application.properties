server.port=10000

# ============================================================
# 数据源配置（MySQL 8，Docker 容器版）
#   url 说明：
#     createDatabaseIfNotExist=true  库不存在时自动创建（flyway_demo）
#     useSSL=false                    本地开发无需 SSL，避免告警
#     allowPublicKeyRetrieval=true    MySQL 8 默认 caching_sha2_password 认证，
#                                     首次连接需要拉取公钥，不加会报 Public Key Retrieval is not allowed
#     serverTimezone=Asia/Shanghai   指定时区，避免服务器时区差异导致时间错乱
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/flyway_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123

# ============================================================
# MyBatis-Plus 配置
#   map-underscore-to-camel-case ：数据库下划线列名 <-> Java 驼峰属性名自动映射
#     （如 created_at -> createdAt），mybatis-plus 默认开启，此处显式写出便于教学
#   log-impl                     ：控制台打印执行的 SQL，方便观察 MyBatis-Plus 生成的语句
#
# 注意：MyBatis-Plus 本身没有自动建表机制，表结构完全由 Flyway 管理，
# 这就是二者能「职责分离、互不干扰」的根本原因（对比 JPA 的 ddl-auto）。
# ============================================================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ============================================================
# Flyway 配置
#   enabled       ：默认 true，启动时自动执行迁移脚本
#   locations     ：脚本目录，默认就是 classpath:db/migration，此处显式写出便于教学
#   baseline-on-migrate ：对「已存在但无 flyway_schema_history 表」的库，
#                         自动打 baseline（V1 之前），避免启动报错
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
