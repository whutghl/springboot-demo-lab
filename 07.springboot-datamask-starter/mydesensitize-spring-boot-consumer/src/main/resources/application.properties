# ====================================================================
# 消费方配置文件
# ====================================================================

# 服务器端口
server.port=8080

# ====================================================================
# 自定义脱敏 Starter 的配置项
#
# 前缀：mydesensitize（与 DesensitizeProperties 中的 @ConfigurationProperties(prefix) 一致）
#
# 可配置的属性（均为可选，有默认值）：
#   mydesensitize.mask-char=*                   脱敏符号，默认 *
#   mydesensitize.phone-front-keep=3            手机号保留前几位，默认 3
#   mydesensitize.phone-back-keep=4             手机号保留后几位，默认 4
#   mydesensitize.name-surname-keep=1           姓名保留姓的位数，默认 1
#   mydesensitize.id-card-front-keep=6          身份证保留前几位，默认 6
#   mydesensitize.id-card-back-keep=4           身份证保留后几位，默认 4
#   mydesensitize.address-front-keep=6          地址保留前几位，默认 6
#
# 目前配置仍使用默认值，无需修改即可体验效果。
# 如需自定义，取消注释并修改对应项即可。
# ====================================================================

# 示例：自定义脱敏符号
# mydesensitize.mask-char=#

# 示例：手机号保留前2位+后4位
# mydesensitize.phone-front-keep=2
# mydesensitize.phone-back-keep=4